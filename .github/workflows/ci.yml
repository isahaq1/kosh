name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Shutro is linked from a sibling directory until it is published (docs/shutro-requests.md #5).
      - uses: actions/checkout@v4
        with:
          repository: isahaq1/shutro
          path: shutro-src # checkout cannot write outside the workspace; linked to ../shutro below
      - run: ln -s "$GITHUB_WORKSPACE/shutro-src" "$GITHUB_WORKSPACE/../shutro"
      - run: cd ../shutro && pnpm install --frozen-lockfile && pnpm pack:npm && cd dist-npm/shutro && npm install --omit=dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec biome ci .
      - run: node scripts/check-boundaries.ts
      - run: pnpm build
      - run: pnpm --filter @kosh/web api:check # the committed typed client matches the modules
      - run: pnpm test # integration tests use Testcontainers (Docker is available on ubuntu-latest)

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/checkout@v4
        with:
          repository: isahaq1/shutro
          path: shutro-src # checkout cannot write outside the workspace; linked to ../shutro below
      - run: ln -s "$GITHUB_WORKSPACE/shutro-src" "$GITHUB_WORKSPACE/../shutro"
      - run: cd ../shutro && pnpm install --frozen-lockfile && pnpm pack:npm && cd dist-npm/shutro && npm install --omit=dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kosh/web exec playwright install --with-deps chromium
      - run: pnpm build # the e2e API server (Node, PostgreSQL via Testcontainers) runs the built packages
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
