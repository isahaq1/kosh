name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Shutro is linked from a sibling directory until it is published (docs/shutro-requests.md #5).
      - uses: actions/checkout@v4
        with:
          repository: isahaq1/shutro
          path: shutro-src # checkout cannot write outside the workspace; linked to ../shutro below
      - run: ln -s "$GITHUB_WORKSPACE/shutro-src" "$GITHUB_WORKSPACE/../shutro"
      - run: cd ../shutro && pnpm install --frozen-lockfile && pnpm pack:npm && cd dist-npm/shutro && npm install --omit=dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Biome, the Shutro boundary, model views up to date, and the module standard (RFC 0023).
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @kosh/web api:check # the committed typed client matches the modules
      # The flaky-test ledger (RFC 0034 step 1): strikes carry over between runs; three fail the build.
      - uses: actions/cache/restore@v4
        with:
          path: .flaky-ledger.json
          key: flaky-ledger-${{ github.run_id }}
          restore-keys: flaky-ledger-
      # One PostgreSQL container for the run, a database per test file on it (Docker is on ubuntu-latest).
      - run: pnpm test
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .flaky-ledger.json
          key: flaky-ledger-${{ github.run_id }}

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/checkout@v4
        with:
          repository: isahaq1/shutro
          path: shutro-src # checkout cannot write outside the workspace; linked to ../shutro below
      - run: ln -s "$GITHUB_WORKSPACE/shutro-src" "$GITHUB_WORKSPACE/../shutro"
      - run: cd ../shutro && pnpm install --frozen-lockfile && pnpm pack:npm && cd dist-npm/shutro && npm install --omit=dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kosh/web exec playwright install --with-deps chromium
      - run: pnpm build # the e2e API server (Node, PostgreSQL via Testcontainers) runs the built packages
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/portal/playwright-report

  bench:
    # Performance budgets (CLAUDE.md): 1M-row pivot, streamed export, list pages; the business apps (RFC 0008 §5.7)
    # on 10k orders and 1k invoices. Main only: seeding takes minutes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/checkout@v4
        with:
          repository: isahaq1/shutro
          path: shutro-src
      - run: ln -s "$GITHUB_WORKSPACE/shutro-src" "$GITHUB_WORKSPACE/../shutro"
      - run: cd ../shutro && pnpm install --frozen-lockfile && pnpm pack:npm && cd dist-npm/shutro && npm install --omit=dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench
